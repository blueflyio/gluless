# GluLess CI (TRANSITIONAL)
#
# GitLab is being exited (bc-escm, cutover bc-m0j6). This file exists only so
# any remaining GitLab mirror of this repository verifies until the exit; the
# canonical verification workflow is .forgejo/workflows/verify.yml and the two
# must stay behaviourally identical. Do not add jobs here.
#
# The former `pages` include was removed: demo/ no longer exists in this
# repository and the component would fail on every pipeline.

include:
  - component: $CI_SERVER_FQDN/blueflyio/gitlab_components/minimal-ci@release/v0.1.x

test:python:
  stage: test
  tags:
    - $BUILD_RUNNER_TAG
  image: python:3.12-slim
  variables:
    GLULESS_HOME: $CI_PROJECT_DIR/.gluless-ci
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - cd sdk/python
    - pip install -q -e ".[dev]"
  script:
    - ruff check .
    - python -m gluless.schema --check
    - pytest -q --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: sdk/python/junit.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
