# GluLess deterministic verification (Forgejo Actions).
#
# Source-control authority per bc-escm (2026-09-23): Forgejo is canonical,
# GitLab is transitional until the 2026-12-15 exit. This workflow is the
# FORGEJO_ACTION classification of the former .gitlab-ci.yml test:python job
# (bc-kfsv taxonomy): lint, schema drift gate, unit/e2e tests. Nothing here is
# a multi-step process; those belong to Gas City formulas, not CI.
#
# Composition: upstream actions only. When bluefly/forgejo-workflows publishes
# a shared python verification workflow, replace the steps with `uses:` on it.

name: verify

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  python:
    runs-on: docker
    container:
      image: python:3.12-slim
    env:
      GLULESS_HOME: ${{ github.workspace }}/.gluless-ci
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install
        working-directory: sdk/python
        run: pip install -q -e ".[dev]"
      - name: Lint
        working-directory: sdk/python
        run: ruff check .
      - name: IR schema drift gate
        working-directory: sdk/python
        run: python -m gluless.schema --check
      - name: Tests
        working-directory: sdk/python
        run: pytest -q --junitxml=junit.xml
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: sdk/python/junit.xml
          retention-days: 7
